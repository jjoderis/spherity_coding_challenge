services:
  backend:
    image: node:24
    container_name: spherity_coding_challenge_backend
    working_dir: /usr/local/app
    develop:
      watch:
        - path: ./backend/package.json
          action: restart
    volumes:
      - ./backend:/usr/local/app
    ports:
      - 3000:3000
    environment:
      WALLET_URL: "http://localhost:3000"
    user: ${USER_ID}
    networks:
      - spherity_coding_challenge_network
    command: /bin/bash -c "npm install && npm run start:dev"
  frontend:
    image: node:24
    container_name: spherity_coding_challenge_frontend
    working_dir: /usr/local/app/frontend
    develop:
      watch:
        - path: ./frontend/package.json
          action: restart
    volumes:
      - ./frontend:/usr/local/app/frontend
      - ./backend:/usr/local/app/backend
    ports:
      - 3001:3001
    environment:
      BACKEND_URL: "http://backend:3000"
    user: ${USER_ID}
    networks:
      - spherity_coding_challenge_network
    command: /bin/bash -c "npm install && npm run dev"

networks:
  spherity_coding_challenge_network:
    driver: bridge
